# Repository-owned PaddleX module config.
# Upstream: PaddleX 3.7.2 module config for PP-DocLayoutV3.
# Intentional RTX 5060 Ti profile: gpu:0, batch 1, four workers, AMP OFF, dy2st false.
Global:
  model: PP-DocLayoutV3
  mode: train
  dataset_dir: ./dataset/doclayoutv3
  device: gpu:0
  output: ./output

CheckDataset:
  convert:
    enable: false
    src_dataset_type: null
  split:
    enable: false
    train_percent: null
    val_percent: null

Train:
  num_classes: 25
  epochs_iters: 100
  batch_size: 1
  learning_rate: 0.0001
  pretrain_weight_path: https://paddle-model-ecology.bj.bcebos.com/paddlex/official_pretrained_model/PP-DocLayoutV3_pretrained.pdparams
  warmup_steps: 100
  resume_path: null
  log_interval: 10
  eval_interval: 1
  num_workers: 4
  amp: OFF
  dy2st: false
  basic_config_path: configs/doclayoutv3/PP-DocLayoutV3-backend.yaml

Evaluate:
  weight_path: output/best_model/best_model.pdparams
  log_interval: 10

Export:
  weight_path: output/best_model/best_model.pdparams
